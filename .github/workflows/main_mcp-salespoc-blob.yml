# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy .NET MCP servers to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore .\SalesPOC.MCP.sln

      - name: Publish Blob MCP Server
        run: dotnet publish .\dotnet\BlobMcpServer\BlobMcpServer.csproj -c Release -o "${{ github.workspace }}\publish\BlobMcpServer"

      - name: Publish Cosmos MCP Server
        run: dotnet publish .\dotnet\CosmosMcpServer\CosmosMcpServer.csproj -c Release -o "${{ github.workspace }}\publish\CosmosMcpServer"

      - name: Publish SQL MCP Server
        run: dotnet publish .\dotnet\SqlMcpServer\SqlMcpServer.csproj -c Release -o "${{ github.workspace }}\publish\SqlMcpServer"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-mcp-servers
          path: ${{ github.workspace }}\publish

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: dotnet-mcp-servers
          path: .\publish
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FEEBFFEEED954DCCB62A81649632032E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4B2CB6F92E03448FA81C9752E6FD3556 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1A02BF49454043DEAC0FAC98727B9FAA }}

      - name: Provision App Service Plans and Apps
        shell: pwsh
        env:
          BLOB_APP_NAME: MCP-SalesPOC-Blob
          COSMOS_APP_NAME: MCP-SalesPOC-Cosmos
          SQL_APP_NAME: MCP-SalesPOC-Sql
          PLAN_RESOURCE_ID: /subscriptions/86b37969-9445-49cf-b03f-d8866235171c/resourceGroups/ai-myaacoub/providers/Microsoft.Web/serverFarms/ASP-aimyaacoub-87dc
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:PLAN_RESOURCE_ID)) {
            throw 'PLAN_RESOURCE_ID is not configured.'
          }

          $planResourceId = $env:PLAN_RESOURCE_ID
          $subscriptionId = ($planResourceId -split '/')[2]
          if ([string]::IsNullOrWhiteSpace($subscriptionId)) {
            throw "Could not parse subscription id from PLAN_RESOURCE_ID: $planResourceId"
          }

          az account set --subscription $subscriptionId | Out-Null

          $plan = az appservice plan show --ids $planResourceId -o json | ConvertFrom-Json
          if ($null -eq $plan -or [string]::IsNullOrWhiteSpace($plan.id)) {
            throw "App Service Plan not found by id: $planResourceId"
          }

          $planName = $plan.name
          $resourceGroup = $plan.resourceGroup

          if ([string]::IsNullOrWhiteSpace($resourceGroup)) {
            throw "Resource group could not be resolved from plan id: $planResourceId"
          }

          function Ensure-WebApp {
            param(
              [Parameter(Mandatory = $true)] [string] $AppName,
              [Parameter(Mandatory = $true)] [string] $PlanName
            )

            $planId = az appservice plan show --name $PlanName --resource-group $resourceGroup --query id -o tsv
            $appExists = az webapp show --name $AppName --resource-group $resourceGroup --query name -o tsv 2>$null

            if ($appExists) {
              az webapp update --name $AppName --resource-group $resourceGroup --set serverFarmId=$planId | Out-Null
            } else {
              az webapp create --name $AppName --resource-group $resourceGroup --plan $PlanName | Out-Null
            }
          }

          Ensure-WebApp -AppName $env:BLOB_APP_NAME -PlanName $planName
          Ensure-WebApp -AppName $env:COSMOS_APP_NAME -PlanName $planName
          Ensure-WebApp -AppName $env:SQL_APP_NAME -PlanName $planName

      - name: Deploy Blob MCP Server
        id: deploy-blob
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'MCP-SalesPOC-Blob'
          slot-name: 'Production'
          package: .\publish\BlobMcpServer

      - name: Deploy Cosmos MCP Server
        id: deploy-cosmos
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'MCP-SalesPOC-Cosmos'
          slot-name: 'Production'
          package: .\publish\CosmosMcpServer

      - name: Deploy SQL MCP Server
        id: deploy-sql
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'MCP-SalesPOC-Sql'
          slot-name: 'Production'
          package: .\publish\SqlMcpServer
          