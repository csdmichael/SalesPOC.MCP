# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy .NET MCP servers to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore .\SalesPOC.MCP.sln

      - name: Publish Blob MCP Server
        run: dotnet publish .\dotnet\BlobMcpServer\BlobMcpServer.csproj -c Release -o "${{ github.workspace }}\publish\BlobMcpServer"

      - name: Publish Cosmos MCP Server
        run: dotnet publish .\dotnet\CosmosMcpServer\CosmosMcpServer.csproj -c Release -o "${{ github.workspace }}\publish\CosmosMcpServer"

      - name: Publish SQL MCP Server
        run: dotnet publish .\dotnet\SqlMcpServer\SqlMcpServer.csproj -c Release -o "${{ github.workspace }}\publish\SqlMcpServer"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-mcp-servers
          path: ${{ github.workspace }}\publish

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: dotnet-mcp-servers
          path: .\publish
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FEEBFFEEED954DCCB62A81649632032E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4B2CB6F92E03448FA81C9752E6FD3556 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1A02BF49454043DEAC0FAC98727B9FAA }}

      - name: Validate target Web Apps
        shell: pwsh
        env:
          BLOB_APP_NAME: MCP-SalesPOC-Blob
          COSMOS_APP_NAME: MCP-SalesPOC-Cosmos
          SQL_APP_NAME: MCP-SalesPOC-Sql
          RESOURCE_GROUP: ai-myaacoub
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:RESOURCE_GROUP)) {
            throw 'RESOURCE_GROUP is not configured.'
          }

          $resourceGroup = $env:RESOURCE_GROUP
          $missingApps = New-Object System.Collections.Generic.List[string]
          $apps = @($env:BLOB_APP_NAME, $env:COSMOS_APP_NAME, $env:SQL_APP_NAME)

          foreach ($app in $apps) {
            $exists = az webapp show --name $app --resource-group $resourceGroup --query name -o tsv 2>$null
            if ([string]::IsNullOrWhiteSpace($exists)) {
              $missingApps.Add($app)
            }
          }

          if ($missingApps.Count -gt 0) {
            $list = $missingApps -join ', '
            throw "Missing Web App(s) in resource group '$resourceGroup': $list. Create them manually or grant permissions to provision them."
          }

      - name: Deploy Blob MCP Server
        id: deploy-blob
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'MCP-SalesPOC-Blob'
          slot-name: 'Production'
          package: .\publish\BlobMcpServer

      - name: Deploy Cosmos MCP Server
        id: deploy-cosmos
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'MCP-SalesPOC-Cosmos'
          slot-name: 'Production'
          package: .\publish\CosmosMcpServer

      - name: Deploy SQL MCP Server
        id: deploy-sql
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'MCP-SalesPOC-Sql'
          slot-name: 'Production'
          package: .\publish\SqlMcpServer
          